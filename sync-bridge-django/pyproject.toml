[project]
name = "sync-bridge-django"
version = "0.1.0"
description = "Sync Bridge is a robust data synchronization service built with Django."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Django>=5.1,<6",
    "djangorestframework>=3.15,<4",
    "strawberry-graphql>=0.289.0,<1",
    "strawberry-graphql-django>=0.73.1,<1",
    "channels>=4.1,<5",
    "daphne>=4.1,<5",
    "python-dotenv>=1.0,<2",
    "drf-spectacular>=0.27,<1",
]

[dependency-groups]
dev = [
    "ruff>=0.3.0",
]

