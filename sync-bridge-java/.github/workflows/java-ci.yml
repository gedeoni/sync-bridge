name: Java CI

on:
  push:
    branches: ["main", "master", "develop"]
  pull_request:
    branches: ["main", "master", "develop"]

jobs:
  lint-and-test:
    name: Lint & Test (Java ${{ matrix.java }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        java: [17]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: maven

      # ── Lint ──────────────────────────────────────────────────────────────
      - name: Run Checkstyle (lint)
        run: mvn --batch-mode checkstyle:check

      # ── Build (skip tests here, run them separately for clearer output) ───
      - name: Compile
        run: mvn --batch-mode -DskipTests compile

      # ── Test ──────────────────────────────────────────────────────────────
      - name: Run tests
        run: mvn --batch-mode test

      # Upload test reports so failures are browsable in the Actions UI
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-java-${{ matrix.java }}
          path: target/surefire-reports/
          retention-days: 14
